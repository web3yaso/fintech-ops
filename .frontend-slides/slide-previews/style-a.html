<!doctype html><html><head><meta charset="utf-8"><title>Ops Control Tower</title>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;800;900&family=Nunito:wght@400;600&display=swap" rel="stylesheet">
<style>
*{margin:0;box-sizing:border-box} html,body{height:100%;background:#eee;overflow:hidden}
.vp{position:fixed;inset:0;display:grid;place-items:center;background:#ddd}
.stage{width:1920px;height:1080px;background:#fff;position:relative;overflow:hidden;
  transform-origin:center}
.grid{position:absolute;inset:0;background-image:linear-gradient(#0001 1px,transparent 1px),linear-gradient(90deg,#0001 1px,transparent 1px);background-size:120px 120px}
.rule{position:absolute;left:120px;right:120px;top:200px;height:6px;background:#000}
.kick{position:absolute;left:120px;top:120px;font:600 26px Nunito;letter-spacing:.25em;text-transform:uppercase}
.kick b{color:#ff3300}
h1{position:absolute;left:114px;top:250px;font:900 150px/1.02 Archivo;color:#000;letter-spacing:-.02em;animation:up .7s .1s both}
h1 span{color:#ff3300}
.sub{position:absolute;left:120px;top:600px;width:1100px;font:400 40px/1.4 Nunito;color:#222;animation:up .7s .25s both}
.stats{position:absolute;left:120px;bottom:120px;display:flex;gap:60px;animation:up .7s .4s both}
.stat{border-left:6px solid #ff3300;padding-left:24px}
.stat .v{font:800 56px Archivo}
.stat .l{font:600 22px Nunito;color:#666;text-transform:uppercase;letter-spacing:.12em}
.meta{position:absolute;right:120px;bottom:120px;text-align:right;font:600 24px Nunito;color:#888}
.sq{position:absolute;right:120px;top:120px;width:140px;height:140px;background:#ff3300}
@keyframes up{from{opacity:0;transform:translateY(30px)}to{opacity:1;transform:none}}
</style></head><body><div class="vp"><div class="stage" id="s">
<div class="grid"></div><div class="sq"></div>
<div class="kick">Loop take-home <b>·</b> AI-native operations</div>
<div class="rule"></div>
<h1>Ops Control<br><span>Tower</span></h1>
<div class="sub">One loop owner + an AI execution layer. Real agent leverage is structural, not conversational.</div>
<div class="stats">
 <div class="stat"><div class="v">14/14</div><div class="l">declines detected</div></div>
 <div class="stat"><div class="v">75→96%</div><div class="l">after 2 corrections</div></div>
 <div class="stat"><div class="v">71</div><div class="l">tests green</div></div>
</div>
<div class="meta">Sophie Huang · 2026-08</div>
</div></div><script>
const f=()=>{const s=document.getElementById('s');s.style.transform=`scale(${Math.min(innerWidth/1920,innerHeight/1080)})`};addEventListener('resize',f);f();
</script></body></html>
